; LilyGo T-SIM7000G HTTPS via loaded ISRG Root X1 CA cert in modem FS.

[env:t-sim7000g]
platform = espressif32@6.7.0
framework = arduino
board = esp32dev
upload_speed = 460800
monitor_speed = 115200
; default.csv gives two ~1.9 MB app slots for OTA + ~190 KB SPIFFS on 4 MB flash.
; Our firmware is ~330 KB so plenty of room for growth.
board_build.partitions = default.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

lib_deps =
